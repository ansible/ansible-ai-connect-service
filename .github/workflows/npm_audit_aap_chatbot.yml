name: AAP Chatbot - npm-audit

permissions:
  contents: read

on:
  # Daily on main, so a newly published advisory shows up the day it lands
  # instead of on the next PR that happens to touch these paths.
  schedule:
    - cron: "10 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - 'stable-*'
    paths:
      - aap_chatbot/**
  pull_request:
    branches:
      - main
      - 'stable-*'
    paths:
      - aap_chatbot/**

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      WORKING_DIRECTORY: ./aap_chatbot

    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '21.x'
          cache: 'npm'
          cache-dependency-path: ${{env.WORKING_DIRECTORY}}/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Run npm audit
        uses: oke-py/npm-audit-action@v5
        with:
          audit_level: low
          github_token: ${{ secrets.GITHUB_TOKEN }}
          create_issues: false
          create_pr_comments: false
          working_directory: ${{env.WORKING_DIRECTORY}}
