name: wisdom-service - pip-audit

on:
  # Daily on main, so a newly published advisory shows up the day it lands
  # instead of on the next PR that happens to touch these paths.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
  push:
    # tags:
    #   - v*
    branches:
      - main
      - 'stable-*'
    paths:
      - .github/workflows/pip_audit.yml
      - ansible_ai_connect/**
      - pyproject.toml
      - uv.lock
      - requirements.txt
  pull_request:
    branches:
      - main
      - 'stable-*'
    paths:
      - .github/workflows/pip_audit.yml
      - ansible_ai_connect/**
      - pyproject.toml
      - uv.lock
      - requirements.txt
permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: install
        run: |
          python -m venv env/
          source env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          # See: https://github.com/advisories/GHSA-r9hx-vwmv-q579
          pip install --upgrade setuptools
      - name: Create CA symlink to use RH's certifi on ubuntu-latest
        run: |
          sudo mkdir -p /etc/pki/tls/certs
          sudo ln -s /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt
      - uses: pypa/gh-action-pip-audit@v1.0.8
        with:
          virtual-environment: env/
          ignore-vulns: |
            # pip symlink extraction vulnerability - CI pip version varies
            # See: https://github.com/advisories/GHSA-4xh5-x5gv-qwph
            GHSA-4xh5-x5gv-qwph
            # No fix available yet for pygments ReDoS
            # See: https://www.cve.org/CVERecord?id=CVE-2026-4539
            CVE-2026-4539
            # Disputed — pyjwt 2.12.1 is latest, no fix version available
            # See: https://osv.dev/vulnerability/PYSEC-2025-183
            PYSEC-2025-183
            # social-auth-core 5.0.0 fixes these, but needs social-auth-app-django 6.x
            # and both are capped (~=4.7.0 / ~=5.6.0) in pyproject.toml. None is
            # reachable: AUTHENTICATION_BACKENDS enables only OpenIdConnectAuth,
            # AAPOAuth2 and (optionally) GitHub, and SOCIAL_AUTH_PIPELINE has no
            # partial steps. Remove once social-auth-core>=5.0.0 lands (review by 2026-12-31).
            # SAML account association (backend not enabled)
            CVE-2026-57175
            # Vend backend (not enabled)
            CVE-2026-57176
            # LoginRadius backend (not enabled)
            CVE-2026-57177
            # vk-app backend (not enabled)
            CVE-2026-57178
            # partial pipeline resume (no partial steps in SOCIAL_AUTH_PIPELINE)
            CVE-2026-57179
            # oauthlib 4.0.0 fixes this PKCE code_verifier timing leak, but is a major
            # bump under django-oauth-toolkit and needs its own PR. Not practically
            # exploitable: our VS Code client uses S256, where the leak reveals at most
            # the already-public code_challenge, and codes are single-use with a 60s
            # lifetime. Remove once oauthlib>=4.0.0 lands (review by 2026-12-31).
            # See: https://osv.dev/vulnerability/CVE-2026-49265
            CVE-2026-49265
            # social-auth-core 5.0.2 fixes CVE-2026-62322 (login CSRF in the
            # LINE backend, which never validated the OAuth state). Not
            # reachable here: AUTHENTICATION_BACKENDS loads only OpenIdConnectAuth,
            # AAPOAuth2 and (optionally) GitHub, never LINE. Blocked by the same
            # social-auth-core~=4.7.0 cap as the entries above.
            # Remove once social-auth-core>=5.0.2 lands (review by 2026-12-31).
            # See: https://osv.dev/vulnerability/CVE-2026-62322
            CVE-2026-62322
            # No fix available yet for twisted IMAP4 wildcard ReDoS. Not
            # reachable here: twisted comes in via daphne for its web stack,
            # and nothing imports twisted.mail or runs an IMAP4 server.
            # Remove once a fixed twisted is released (review by 2026-12-31).
            # See: https://osv.dev/vulnerability/CVE-2026-106454
            CVE-2026-106454
