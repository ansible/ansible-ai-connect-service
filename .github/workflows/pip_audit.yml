name: wisdom-service - pip-audit

on:
  # Daily on main, so a newly published advisory shows up the day it lands
  # instead of on the next PR that happens to touch these paths.
  schedule:
    - cron: "30 7 * * *"
  workflow_dispatch:
  push:
    # tags:
    #   - v*
    branches:
      - main
      - 'stable-*'
    paths:
      - .github/workflows/pip_audit.yml
      - ansible_ai_connect/**
      - pyproject.toml
      - uv.lock
      - requirements.txt
  pull_request:
    branches:
      - main
      - 'stable-*'
    paths:
      - .github/workflows/pip_audit.yml
      - ansible_ai_connect/**
      - pyproject.toml
      - uv.lock
      - requirements.txt
permissions:
  contents: read

jobs:
  pip-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: 3.12
      - name: install
        run: |
          python -m venv env/
          source env/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .
          # See: https://github.com/advisories/GHSA-r9hx-vwmv-q579
          pip install --upgrade setuptools
      - name: Create CA symlink to use RH's certifi on ubuntu-latest
        run: |
          sudo mkdir -p /etc/pki/tls/certs
          sudo ln -s /etc/ssl/certs/ca-certificates.crt /etc/pki/tls/certs/ca-bundle.crt
      - uses: pypa/gh-action-pip-audit@v1.0.8
        with:
          virtual-environment: env/
          ignore-vulns: |
            # pip symlink extraction vulnerability - CI pip version varies
            # See: https://github.com/advisories/GHSA-4xh5-x5gv-qwph
            GHSA-4xh5-x5gv-qwph
            # No fix available yet for pygments ReDoS
            # See: https://www.cve.org/CVERecord?id=CVE-2026-4539
            CVE-2026-4539
            # twisted 26.4.0 (via daphne[tls]) is the latest release; fixes for these
            # exist only in 26.10.0rc1. Remove once twisted 26.10.0 is released.
            CVE-2026-115774
            CVE-2026-115775
            CVE-2026-115776
            CVE-2026-115778
            # twisted.web: no released fix yet (fix in 26.10.0rc1). Review by
            # 2026-11-30; remove once twisted 26.10.0 is released.
            CVE-2026-115877
            # Disputed — pyjwt 2.12.1 is latest, no fix version available
            # See: https://osv.dev/vulnerability/PYSEC-2025-183
            PYSEC-2025-183
            # No fix available yet for twisted IMAP4 wildcard ReDoS. Not
            # reachable here: twisted comes in via daphne for its web stack,
            # and nothing imports twisted.mail or runs an IMAP4 server.
            # Remove once a fixed twisted is released (review by 2026-12-31).
            # See: https://osv.dev/vulnerability/CVE-2026-106454
            CVE-2026-106454
            # twisted.names DNS client accepts spoofed UDP answers (fix in 26.10.0rc1
            # only). Not reachable here: nothing imports twisted.names; daphne uses
            # twisted for its web stack only. Remove once twisted 26.10.0 is released
            # (review by 2026-12-31).
            # See: https://osv.dev/vulnerability/CVE-2026-83813
            CVE-2026-83813
