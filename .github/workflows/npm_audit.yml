name: Admin Portal - npm-audit

on:
  # Daily on main, so a newly published advisory shows up the day it lands
  # instead of on the next PR that happens to touch these paths.
  schedule:
    - cron: "20 7 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
      - 'stable-*'
    paths:
      - ansible_ai_connect_admin_portal/**
  pull_request:
    branches:
      - main
      - 'stable-*'
    paths:
      - ansible_ai_connect_admin_portal/**

jobs:
  lint:
    runs-on: ubuntu-latest

    env:
      WORKING_DIRECTORY: ./ansible_ai_connect_admin_portal

    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '21.x'
          cache: 'npm'
          cache-dependency-path: ${{env.WORKING_DIRECTORY}}/package-lock.json

      - name: Install Dependencies
        run: npm ci
        working-directory: ${{env.WORKING_DIRECTORY}}

      # Gate on `npm audit` via audit-ci, which honours a committed allowlist
      # (audit-ci.jsonc). The threshold and the accepted advisories live in that
      # file, so every suppression is reviewed in-repo with a justification and
      # a review-by date rather than hidden behind a raised audit level.
      - name: Run npm audit (audit-ci)
        run: npx --yes audit-ci@^7 --config ./audit-ci.jsonc
        working-directory: ${{env.WORKING_DIRECTORY}}
