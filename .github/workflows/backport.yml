name: Backport merged pull request

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport PR
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true
    steps:

      # korthout/backport-action shells out to git, so the workspace must be a
      # repository. On pull_request_target this checks out the base branch, not
      # the pull request's head, which is what we want here.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backport to release branches
        uses: korthout/backport-action@v3
        with:
          # Backports are opt-in: label a merged PR `backport/<branch>` to get one.
          label_pattern: '^backport/(?<target>.+)$'

          github_token: ${{ secrets.GITHUB_TOKEN }}

          copy_labels_pattern: '^(bug|security|breaking-change|dependencies)$'

          pull_description: |
            # Backport of #${pull_number}

            ${pull_description}

            ---

            **Original PR:** #${pull_number}
            **Backported by:** @${{ github.actor }}

            ## Backport Verification
            - [ ] Changes apply cleanly
            - [ ] Tests pass
            - [ ] No conflicts with target branch

          pull_title: "[Backport ${target_branch}] ${pull_title}"
