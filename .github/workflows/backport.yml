name: Backport merged pull request

on:
  pull_request_target:
    types: [closed, labeled]

permissions:
  contents: write
  pull-requests: write

jobs:
  backport:
    name: Backport PR
    runs-on: ubuntu-latest

    if: github.event.pull_request.merged == true
    steps:

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Backport to release branches
        uses: korthout/backport-action@d07416681cab29bf2661702f925f020aaa962997 # v3
        with:
          label_pattern: '^backport/(?<target>.+)$'

          github_token: ${{ secrets.GITHUB_TOKEN }}

          copy_labels_pattern: '^(bug|security|breaking-change|dependencies)$'

          pull_description: |
            # Backport of #${pull_number}

            ${pull_description}

            ---

            **Original PR:** #${pull_number}
            **Backported by:** @${{ github.actor }}

            ## Backport Verification
            - [ ] Changes apply cleanly
            - [ ] Tests pass
            - [ ] No conflicts with target branch

          pull_title: "[Backport ${target_branch}] ${pull_title}"
