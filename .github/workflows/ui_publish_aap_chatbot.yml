name: AAP Chatbot - Publish

on:
  workflow_dispatch:

# Publishing uses npm trusted publishing (OIDC): npm exchanges this token with
# the registry instead of a long-lived NPM_TOKEN. The trusted publisher on npmjs
# must name this repository and this workflow file.
permissions:
  contents: read
  id-token: write

jobs:

  lint:
    runs-on: ubuntu-latest

    env:
      WORKING_DIRECTORY: ./aap_chatbot

    steps:
      - name: Checkout commit
        uses: actions/checkout@v7

      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: ${{env.WORKING_DIRECTORY}}/package-lock.json

      - name: Install Dependencies & Test env
        run: npm ci && npx playwright install
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Compile
        run: npm run build
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Test
        run: npm run test
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Run linter
        run: npm run eslint
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Pack
        run: npm pack
        working-directory: ${{env.WORKING_DIRECTORY}}

      - name: Ensure npm supports trusted publishing
        run: |
          npm install -g npm@latest
          npm --version

      - name: Publish to npmjs
        run: npm publish --access public
        working-directory: ${{env.WORKING_DIRECTORY}}
