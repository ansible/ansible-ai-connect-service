# Dependabot version updates are DISABLED.
#
# `open-pull-requests-limit: 0` is GitHub's documented way to pause version
# updates for an ecosystem, chosen over deleting this file so the per-ecosystem
# reasoning below survives and re-enabling is a one-character change.
#
# Dependency updates come from MintMaker (Renovate) instead. Running both
# produced duplicate PRs for the same bumps across four ecosystems.
#
# Note: Dependabot SECURITY updates were already disabled at the repository
# level (security_and_analysis.dependabot_security_updates), so after this
# change no Dependabot updates of any kind reach this repository. Renovate is
# the only source, and its vulnerabilityAlerts/osvVulnerabilityAlerts are
# disabled in the shared aap-konflux-pipelines preset -- worth confirming that
# is intended before this lands.
#
version: 2
updates:
  # Python dependencies
  # Use the "uv" ecosystem (not "pip"): requirements.txt is a generated
  # artifact exported from uv.lock + pyproject.toml, and the uv-export CI
  # gate regenerates it. A pip updater edits only requirements.txt, which
  # `uv lock` then reverts, so those PRs can never pass CI. The uv ecosystem
  # updates pyproject.toml + uv.lock (the source of truth) instead.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0  # disabled — see header
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Ignore major version updates (too risky for auto-merge)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Admin Portal npm dependencies
  - package-ecosystem: "npm"
    directory: "/ansible_ai_connect_admin_portal"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0  # disabled — see header
    labels:
      - "dependencies"
      - "javascript"
      - "admin-portal"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Chatbot npm dependencies
  - package-ecosystem: "npm"
    directory: "/ansible_ai_connect_chatbot"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0  # disabled — see header
    labels:
      - "dependencies"
      - "javascript"
      - "chatbot"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 0  # disabled — see header
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    commit-message:
      prefix: "ci"
