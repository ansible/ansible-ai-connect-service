version: 2
updates:
  # Python dependencies
  # Use the "uv" ecosystem (not "pip"): requirements.txt is a generated
  # artifact exported from uv.lock + pyproject.toml, and the uv-export CI
  # gate regenerates it. A pip updater edits only requirements.txt, which
  # `uv lock` then reverts, so those PRs can never pass CI. The uv ecosystem
  # updates pyproject.toml + uv.lock (the source of truth) instead.
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "python"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"
    # Ignore major version updates (too risky for auto-merge)
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]

  # Admin Portal npm dependencies
  - package-ecosystem: "npm"
    directory: "/ansible_ai_connect_admin_portal"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
      - "admin-portal"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  # Chatbot npm dependencies
  - package-ecosystem: "npm"
    directory: "/ansible_ai_connect_chatbot"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "javascript"
      - "chatbot"
      - "security"
    commit-message:
      prefix: "deps"
      include: "scope"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 3
    labels:
      - "dependencies"
      - "github-actions"
      - "security"
    commit-message:
      prefix: "ci"
